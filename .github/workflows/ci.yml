name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Deploy migrasi database hanya dijalankan MANUAL (Actions -> CI Pipeline -> Run workflow)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: tampilkan migrasi yang AKAN dijalankan tanpa menerapkannya"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test

  deploy-migrations:
    name: Deploy DB Migrations (manual)
    runs-on: ubuntu-latest
    needs: test-and-lint
    # Tidak lagi otomatis di setiap push. Hanya jalan jika dipicu manual
    # dari branch main/master. Alasan: skema dasar dibuat lewat dashboard Supabase,
    # sehingga riwayat migrasi di database belum tentu cocok dengan isi folder
    # supabase/migrations. Pastikan `supabase db push --dry-run` kosong sebelum
    # mengaktifkan deploy otomatis lagi.
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: npx supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push Migrations to Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: hanya menampilkan migrasi yang akan dijalankan"
            npx supabase db push --linked --dry-run
          else
            npx supabase db push --linked
          fi
